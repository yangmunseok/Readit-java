<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="csrf-header" th:content="${_csrf.headerName}">
  <meta name="csrf-token" th:content="${_csrf.token}">
  <title>홈페이지</title>
  <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
  <script src="/js/dialog.js"></script>
  <link th:href="@{/app.css}" rel="stylesheet"/>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="/js/logout.js"></script>
</head>
<body>
<div class="relative text-white font-pretendard max-w-screen overflow-x-hidden">
  <header
      class="flex flex-col w-full justify-evenly bg-black/60 bg-[url(/images/Background2.jpg)] bg-blend-multiply bg-cover bg-center">
    <nav class="px-2 w-full h-8 lg:h-12 bg-black/10  border-b border-b-white/10">
      <div class="w-full max-w-7xl h-full flex justify-between items-center p-2 mx-auto">
        <a class="font-bold font-sans text-xl lg:text-2xl" href="/">Readit</a>
        <button
            class="text-sm lg:text-base font-pretendard hover:text-stone-200"
            onclick="logout()"
        >
          로그아웃
        </button>
      </div>
    </nav>
    <div class="flex flex-col mx-auto items-baseline gap-10 lg:gap-20 py-20 w-full max-w-7xl px-5">
      <p class="font-semibold text-3xl lg:text-5xl">
        도서 검색부터 책 위치 확인, 리뷰 공유까지, 한곳에서!
      </p>
      <form
          method="get"
          action="/books"
          role="search"
          class="relative w-full flex items-center"
          id="search-form"
      >
        <input
            type="text"
            name="query"
            class="w-full bg-white text-stone-600 text-base p-4"
            placeholder="원하시는 도서를 검색해주세요"
        />
        <button type="submit" class="absolute right-4">
          <i class="fa-solid fa-magnifying-glass text-black"></i>
        </button>
      </form>
    </div>
  </header>

  <div class="mt-20">
    <div class="text-black mx-auto w-full max-w-7xl p-2">
      <div class="flex w-full justify-between font-bold mb-10">
        <p class="text-2xl">도서 랭킹!</p>
        <a
            href="/books/popular"
            class="flex items-center text-lg text-stone-700"
            id="ranking-page-link"
        >
          더보기
          <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>
      <div class="flex gap-2 lg:justify-between max-w-7xl overflow-x-hidden"
           id="popular-book-container">
        <a th:href="@{/books/{isbn13}(isbn13=${book.isbn13})}" th:each="book: ${bookRanks}">
          <img
              th:src="${book.bookImageURL}"
              class="w-40 h-60 border-2 border-stone-200"
          />
          <div class="mt-5">
            <p th:text="${book.ranking}"
               class="flex items-center justify-center border border-blue-500 rounded-full w-7 h-7 text-blue-700 font-semibold">
            </p>
            <p th:text="${book.bookname}" class="font-bold text-lg w-40 mt-4 book-title">
            </p>
          </div>
        </a>
      </div>
    </div>

    <div class="text-black mx-auto w-full max-w-7xl p-2 mt-20" id="recommendation-container">
      <div class="flex w-full justify-between font-bold mb-10">
        <p th:if="${#lists.size(recommendedBooks)>0}"
           th:text="${user.name}+'님, 최근 책 조회 기록을 바탕으로 좋아하실 만한 책을 추천해 드립니다.'" class="text-2xl">
        </p>
        <p th:unless="${#lists.size(recommendedBooks)>0}"
           th:text="${user.name}+'님, 책의 정보를 조회하고 맞춤 추천 도서를 바로 만나보세요!'" class="text-2xl">
        </p>
      </div>
      <div th:if="${#lists.size(recommendedBooks)>0}"
           class="relative flex w-full overflow-x-scroll lg:justify-between lg:overflow-visible">
        <button
            onClick={prevPage()}
            class="hidden lg:flex absolute  justify-center items-center right-full top-30 translate-x-1/2 border h-10 w-10 rounded-full border-stone-300 bg-white hover:scale-110 group"
        >
          <i class="fa-solid fa-angle-left text-stone-500 group-hover:scale-110"></i>
        </button>
        <th:block th:each="r: ${recommendedBooks}" class="recommendation">
          <a class="recommendation" th:href="@{books/{isbn13}(isbn13=${r.isbn13})}">
            <img
                th:src="${r.bookImageURL}"
                class="w-40 h-60 border-2 border-stone-200"
            />
            <div class="mt-4">
              <p th:text="${r.bookname}" class="font-bold text-lg w-40 h-40">
              </p>
            </div>
          </a>

        </th:block>
        <button
            onClick={nextPage()}
            class="hidden lg:flex absolute justify-center items-center left-full top-30 -translate-x-1/2 border h-10 w-10 rounded-full border-stone-300 bg-white hover:scale-110 group"
        >
          <i class="fa-solid fa-angle-right text-stone-500 group-hover:scale-110"></i>
        </button>
      </div>
    </div>
  </div>
</div>
<script th:inline="javascript">
  init();
  render();
</script>
</body>
</html>
