<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>readit - 로그인</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
      rel="stylesheet">

  <style>
    /* 기본 스타일 초기화 및 폰트 설정 */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Noto Sans KR', sans-serif;
      overflow: hidden; /* 스크롤 방지 */
    }

    /* 배경 이미지 설정: 원본 이미지를 전체 배경으로 사용 */
    .page-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      /* 여기에 이미지 경로를 지정하세요 */
      background-image: url('/images/Background.jpg');
      filter: blur(2px) contrast(90%); /* 이미지를 살짝 흐리게 하여 산뜻함과 집중도를 높임 */
      z-index: -1;
    }

    /* 폼 주변의 반투명 오버레이: 산뜻한 느낌의 비밀 */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, rgba(188, 226, 238, 0.5) 100%); /* 반투명 흰색에서 연한 파란색 그라데이션 */
      z-index: 0;
    }

    /* 로그인 컨테이너 (정중앙 배치) */
    .login-container {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* 로그인 폼 박스 스타일 */
    .login-form-box {
      background-color: rgba(255, 255, 255, 0.95); /* 거의 불투명한 흰색 */
      padding: 50px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); /* 부드러운 그림자 */
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    /* 서비스 로고 스타일: 산뜻한 색상 */
    .logo {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 40px;
      letter-spacing: -1px;
    }

    /* 입력 필드 그룹 */
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    /* 입력 필드 라벨 스타일 */
    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }

    /* 실제 입력 창 스타일 */
    .input-group input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      background-color: #f9f9f9;
      transition: border-color 0.3s;
      box-sizing: border-box; /* 패딩 포함 크기 계산 */
    }

    /* 입력 창 포커스 시 스타일 */
    .input-group input:focus {
      outline: none;
      border-color: #3babc6;
      background-color: #fff;
    }

    /* 일반 로그인 버튼 스타일 */
    .login-button {
      width: 100%;
      padding: 15px;
      background-color: green;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
      margin-bottom: 25px;
      box-shadow: 0 4px 6px rgba(59, 171, 198, 0.2);
    }

    .login-button:hover {
      background-color: darkgreen;
    }

    .login-button:active {
      transform: translateY(1px);
      box-shadow: 0 2px 4px rgba(59, 171, 198, 0.2);
    }

    /* 구분선 */
    .divider {
      position: relative;
      margin: 30px 0;
      text-align: center;
    }

    .divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background-color: #eee;
      z-index: 0;
    }

    .divider span {
      position: relative;
      background-color: rgba(255, 255, 255, 0.95);
      padding: 0 15px;
      color: #aaa;
      font-size: 14px;
      z-index: 1;
    }

    /* 소셜 로그인 버튼 공통 스타일 */
    .social-button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      border: none;
      margin-bottom: 15px;
      transition: transform 0.1s, box-shadow 0.2s;
      text-decoration: none; /* a 태그일 경우 */
      box-sizing: border-box;
    }

    .social-button:active {
      transform: translateY(1px);
    }

    .social-icon {
      width: 20px;
      height: 20px;
      margin-right: 12px;
    }

    /* 카카오 로그인 버튼 스타일: 브랜드 컬러 준수 */
    .btn-kakao {
      background-color: #FEE500;
      color: #191919;
    }

    .btn-kakao:hover {
      box-shadow: 0 4px 6px rgba(254, 229, 0, 0.3);
    }

    /* 구글 로그인 버튼 스타일: 브랜드 컬러 준수 (흰색 기반) */
    .btn-google {
      background-color: white;
      color: #555;
      border: 1px solid #ddd;
    }

    .btn-google:hover {
      background-color: #f5f5f5;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    /* 추가 링크들 (비밀번호 찾기, 회원가입) */
    .extra-links {
      margin-top: 30px;
      font-size: 14px;
      color: #888;
    }

    .extra-links a {
      color: #666;
      text-decoration: none;
      margin: 0 8px;
    }

    .extra-links a:hover {
      color: #3babc6;
      text-decoration: underline;
    }

    /* 반응형: 작은 화면에서는 폼 크기 조정 */
    @media (max-width: 480px) {
      .login-form-box {
        padding: 30px;
        border-radius: 15px;
        width: 90%;
      }

      .logo {
        font-size: 30px;
        margin-bottom: 30px;
      }
    }
  </style>
</head>
<body>

<div class="page-background"
     th:style="'background-image: url(' + @{/images/Background.jpg} + ');'"></div>

<div class="overlay"></div>

<div class="login-container">
  <div class="login-form-box">
    <div class="logo">readit</div>

    <form th:action="@{/login}" method="post" sec:authorize="isAnonymous()">
      <input type="hidden"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}"/>

      <div class="input-group">
        <label for="username">사용자 이름</label>
        <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required>
      </div>

      <div class="input-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
      </div>

      <button type="submit" class="login-button">로그인</button>
    </form>

    <div class="divider">
      <span>또는 간편하게 로그인</span>
    </div>

    <a href="#" class="social-button btn-kakao" th:href="@{/oauth2/authorization/kakao}">
      <img class="social-icon"
           src="https://upload.wikimedia.org/wikipedia/commons/e/e3/KakaoTalk_logo.svg"
           alt="Kakao Logo">
      카카오로 로그인
    </a>

    <a href="#" class="social-button btn-google" th:href="@{/oauth2/authorization/google}">
      <img class="social-icon" src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png"
           style="width: 22px; height: auto;"
           alt="Google Logo">
      구글로 로그인
    </a>

    <div class="extra-links">
      <a href="#">비밀번호 찾기</a>
      <span>|</span>
      <a href="#">회원가입</a>
    </div>

  </div>
</div>

</body>
</html>
